name: CI

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - run: npm ci

      - run: npm run build

      - run: npm test
